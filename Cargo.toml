[workspace]
resolver = "3"
members = ["crates/appkit-host", "crates/iced-appkit"]
# The Phase 0 spike lives in spike/ as its own workspace (it patches wgpu-hal;
# this workspace must build against stock crates).
exclude = ["spike"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
publish = false
