[workspace]
resolver = "3"
members = ["crates/appkit-host", "crates/iced-appkit", "crates/appkit-ui", "crates/cargo-ferrokit"]
exclude = ["spike"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/lhassa8/ferrokit"
keywords = ["iced", "appkit", "macos", "gui", "native"]
categories = ["gui", "os::macos-apis"]
