[workspace]
resolver = "3"
members = ["crates/ferrokit-core", "crates/ferrokit", "crates/cargo-ferrokit"]
exclude = ["renamed", "retired"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/lhassa8/ferrokit"
keywords = ["appkit", "macos", "gui", "native", "ui"]
categories = ["gui", "os::macos-apis"]
