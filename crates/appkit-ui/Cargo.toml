[package]
name = "appkit-ui"
version = "0.0.0"
description = "A native macOS UI framework for Rust: real AppKit views, fine-grained signals (Phase 2, unreleased)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"

[dependencies]
appkit-host = { path = "../appkit-host", version = "0.1.0" }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject", "NSNotification", "NSArray", "NSDictionary", "NSData", "NSRange", "NSUndoManager", "NSIndexSet", "NSSortDescriptor"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSRunningApplication", "NSControl", "NSButton", "NSTextField", "NSLayoutConstraint", "NSSecureTextField", "NSSwitch", "NSCell", "NSText", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSSlider", "NSStepper", "NSProgressIndicator", "NSImage", "NSImageView", "NSBox", "NSScrollView", "NSClipView", "NSBitmapImageRep", "NSImageRep", "NSAppearance", "NSGraphicsContext", "NSTextView", "NSTextInputClient", "NSTableView", "NSTableColumn", "NSOutlineView", "NSTableCellView", "NSTableHeaderView", "NSUserInterfaceItemIdentification", "NSSpellChecker"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop"] }
