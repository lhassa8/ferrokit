[package]
name = "appkit-host"
version.workspace = true
readme = "README.md"
description = "Host-agnostic layer for placing real AppKit views inside a GPU-rendered window"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["appkit", "macos", "gui", "native", "objc2"]
categories.workspace = true

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSDictionary", "NSGeometry", "NSIndexSet", "NSKeyValueObserving", "NSRange", "NSSortDescriptor", "NSUndoManager", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSColorSpace", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSResponder", "NSScrollView", "NSTableColumn", "NSTableView", "NSFont", "NSText", "NSTextContainer", "NSTextField", "NSTextInputClient", "NSTextStorage", "NSTextView", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSPasteboard", "NSPasteboardItem", "NSDragging"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop", "CFDate"] }
block2 = "0.6"
