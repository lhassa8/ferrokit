# Runs on GitHub's macOS runners once the repository is pushed (not yet).
# The suites drive real windows; hosted runners have a logged-in GUI
# session, but posted-event and timing checks are unverified there, so they
# don't fail the build yet.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the supported minimum; macos-latest tracks the current release.
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build (workspace and examples)
        run: cargo build --release --workspace --examples
      - name: Clippy
        run: cargo clippy --release --workspace --examples -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --no-deps -p appkit-host -p iced-appkit -p appkit-ui -p cargo-ferrokit
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Suites (unattended, every app's CHECK=all)
        continue-on-error: true
        run: scripts/check-all.sh --no-lint
        timeout-minutes: 35
        env:
          CHECK_ALL_LOGS: ${{ runner.temp }}/check-all
      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/check-all
          if-no-files-found: ignore
