# Thanks people for their first issue or pull request here.
name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    # Not for the maintainer's own issues and pull requests.
    if: github.actor != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here. I read every one and usually reply within a day or two.
          pr-message: |
            Thanks for your first pull request! CI runs on macOS 15 and the current macOS; I'll review it within a few days. CONTRIBUTING.md has the checklist if anything's missing.
